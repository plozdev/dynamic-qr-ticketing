server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dynamic-qr-ticketing

  # Database Connection & HikariCP for Cloud Run & Cloud SQL / Supabase / Neon
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CloudRunHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000

  # JPA & Hibernate Configurations for Production
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Flyway Migration enabled for Production
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Spring Modulith Event Publication & Outbox
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: archive

# Observability for Cloud Run Health Probes
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Business & Cryptographic Configurations
app:
  qr:
    rotation-interval-seconds: 30
    drift-tolerance-windows: 1
    anti-replay-ttl-seconds: 60

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
